<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tech Comm Arena</title>
  <style>
    :root {
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      --bg: #fff;
      --tx: #1f2328;
      --mut: #656d76;
      --bd: #d0d7de;
      --sf: #f6f8fa;
      --ac: #24292f;
      --acx: #fff;
      --ok: #1a7f37;
      --okb: #dafbe1;
      --no: #cf222e;
      --nob: #ffebe9
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --bg: #1b1d21;
        --tx: #e6e8eb;
        --mut: #9aa1ab;
        --bd: #3a3f47;
        --sf: #24272c;
        --ac: #e6e8eb;
        --acx: #1b1d21;
        --ok: #56d364;
        --okb: #16301f;
        --no: #ff7b72;
        --nob: #3b1d1d
      }
    }

    :root[data-theme="dark"] {
      --bg: #1b1d21;
      --tx: #e6e8eb;
      --mut: #9aa1ab;
      --bd: #3a3f47;
      --sf: #24272c;
      --ac: #e6e8eb;
      --acx: #1b1d21;
      --ok: #56d364;
      --okb: #16301f;
      --no: #ff7b72;
      --nob: #3b1d1d
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--tx);
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif
    }

    .app {
      max-width: 600px;
      margin: auto;
      padding: 28px 16px
    }

    h1 {
      margin: 0 0 6px;
      font-size: 24px;
      font-weight: 600
    }

    h3 {
      font-size: 15px;
      margin: 24px 0 8px
    }

    .m {
      color: var(--mut);
      margin: 0 0 20px
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px
    }

    .world,
    .opt,
    .btn {
      font: inherit;
      color: var(--tx);
      background: var(--bg);
      border: 1px solid var(--bd);
      border-radius: 8px;
      padding: 14px;
      cursor: pointer;
      text-align: left
    }

    .world {
      display: flex;
      flex-direction: column;
      gap: 2px
    }

    .world:hover,
    .opt:hover:not(:disabled) {
      border-color: var(--tx);
      background: var(--sf)
    }

    .world b {
      font-weight: 600
    }

    .num,
    small,
    .tag {
      color: var(--mut);
      font-size: 12px
    }

    .boss {
      width: 100%;
      background: var(--sf)
    }

    .hud {
      display: flex;
      justify-content: space-between;
      color: var(--mut);
      font-size: 13px;
      margin-bottom: 10px
    }

    .hud b {
      color: var(--tx)
    }

    .bar {
      height: 4px;
      background: var(--bd);
      border-radius: 2px;
      overflow: hidden;
      margin: 6px 0
    }

    .bar i {
      display: block;
      height: 100%;
      background: var(--ac);
      transition: width .1s linear
    }

    .tag {
      text-transform: uppercase;
      letter-spacing: .04em;
      margin-top: 16px
    }

    .q {
      font-size: 20px;
      font-weight: 600;
      line-height: 1.35;
      margin: 8px 0 16px
    }

    .opt {
      display: block;
      width: 100%;
      margin: 8px 0
    }

    .opt:disabled {
      cursor: default
    }

    .opt.ok {
      border-color: var(--ok);
      background: var(--okb)
    }

    .opt.no {
      border-color: var(--no);
      background: var(--nob)
    }

    .btn {
      background: var(--ac);
      border-color: var(--ac);
      color: var(--acx);
      text-align: center;
      font-weight: 600;
      width: 100%;
      margin-top: 10px
    }

    .btn.alt {
      background: var(--bg);
      color: var(--tx);
      border-color: var(--bd)
    }

    .fb {
      min-height: 22px;
      color: var(--mut);
      font-size: 14px;
      margin: 8px 0 0
    }

    .miss {
      background: var(--sf);
      border: 1px solid var(--bd);
      border-radius: 8px;
      padding: 12px;
      margin: 8px 0;
      font-size: 14px
    }

    .inp {
      font: inherit;
      color: var(--tx);
      background: var(--bg);
      border: 1px solid var(--bd);
      border-radius: 8px;
      padding: 10px 12px;
      width: 100%;
      margin: 8px 0
    }

    .lb {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      margin: 8px 0
    }

    .lb th,
    .lb td {
      text-align: left;
      padding: 8px 6px;
      border-bottom: 1px solid var(--bd);
      white-space: nowrap
    }

    .lb th {
      color: var(--mut);
      font-weight: 600
    }

    .q img,
    .opt img,
    .miss img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 6px auto
    }

    .opt img {
      max-height: 80px;
      object-fit: contain
    }

    .notes {
      line-height: 1.6;
      font-size: 14px;
      margin-bottom: 20px
    }

    .notes h3 {
      font-size: 16px;
      color: var(--tx);
      border-bottom: 1px solid var(--bd);
      padding-bottom: 6px;
      margin: 18px 0 8px
    }

    .notes p,
    .notes ul {
      margin: 8px 0;
      color: var(--mut)
    }

    .notes ul {
      padding-left: 20px
    }

    .notes li {
      margin: 4px 0
    }

    .notes code {
      font-family: monospace;
      background: var(--sf);
      border: 1px solid var(--bd);
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 13px;
      color: var(--tx)
    }

    .notes pre {
      background: var(--sf);
      border: 1px solid var(--bd);
      border-radius: 6px;
      padding: 10px;
      overflow-x: auto;
      margin: 8px 0
    }

    .notes pre code {
      border: none;
      padding: 0;
      background: transparent
    }
  </style>

    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };

</head>

<div class="note-sec">
  <h3>1. MySQL Basics</h3>
  <p><b>RDBMS</b>: <i>Relational Database Management System</i>. MySQL is a relational database server software used to store, manage, and retrieve structured data in tables.</p>
  <p><b>XAMPP</b>: A popular software stack bundling <b>Apache</b> (web server), <b>MySQL / MariaDB</b> (database server), <b>PHP</b>, and <b>Perl</b>.</p>
  <p><b>phpMyAdmin</b>: A web-based administration tool for MySQL. Its three main administrative levels from broadest to most specific are: <b>Server &rarr; Database &rarr; Table</b>. Both <b>Apache</b> and <b>MySQL</b> must be running to access phpMyAdmin in your web browser.</p>
  <p><b>Database Schema</b>: Defines the structure, blueprint, and organization of database objects (tables, columns, data types, constraints) rather than the actual records stored within tables.</p>
  <p><b>Table, Row, and Column</b>: A table stores related data in rows and columns. A <b>row</b> is also called a <b>record</b> (or tuple), while a <b>column</b> represents an attribute (or field).</p>
</div>

<div class="note-sec">
  <h3>2. SQL Command Categories</h3>
  <p>SQL statements are terminated by a <b>semi-colon (<code>;</code>)</b>.</p>
  <ul>
    <li><b>DDL (Data Definition Language)</b>: Commands that define, alter, and delete database structure. Examples: <code>CREATE</code>, <code>ALTER</code>, <code>DROP</code>, <code>TRUNCATE</code>.</li>
    <li><b>DML (Data Manipulation Language)</b>: Commands that add, modify, query, and delete data records. Examples: <code>INSERT</code>, <code>UPDATE</code>, <code>DELETE</code>, and <code>SELECT</code> (also classified as DQL - Data Query Language).</li>
    <li><b>DCL (Data Control Language)</b>: Commands that control access permissions and privileges. Examples: <code>GRANT</code>, <code>REVOKE</code>.</li>
    <li><b>TCL (Transaction Control Language)</b>: Commands that manage database transactions. Examples: <code>COMMIT</code>, <code>ROLLBACK</code>, <code>SAVEPOINT</code>.</li>
  </ul>
</div>

<div class="note-sec">
  <h3>3. MySQL History</h3>
  <ul>
    <li><b>Original Developers</b>: Created in Sweden by <b>David Axmark</b> and <b>Michael "Monty" Widenius</b> at <b>MySQL AB</b>.</li>
    <li><b>Public Release</b>: First released publicly in <b>1995</b>.</li>
    <li><b>Acquisitions</b>: Acquired by <b>Sun Microsystems</b> in <b>2008</b>; Sun Microsystems was subsequently acquired by <b>Oracle Corporation</b> in <b>2010</b>.</li>
    <li><b>MariaDB</b>: A community-developed open-source fork of MySQL created by original developers after the Oracle acquisition (not an early version or former name of MySQL).</li>
  </ul>
</div>

<div class="note-sec">
  <h3>4. Stored Procedures</h3>
  <p>A stored procedure is a prepared, compiled set of SQL statements stored in the database for code reuse, security, and performance.</p>
  <ul>
    <li><b>DELIMITER</b>: Changes the statement termination character in command-line clients (commonly to <code>//</code> or <code>$$</code>) so inner semicolons within the procedure body do not execute prematurely.</li>
    <li><b>Structure & Keywords</b>:
      <pre><code>DELIMITER //
CREATE PROCEDURE procedure_name(IN p_id INT, OUT p_name VARCHAR(50))
BEGIN
  -- executable statements
END //
DELIMITER ;</code></pre>
    </li>
    <li><b>Invocation & Deletion</b>:
      <ul>
        <li>Execute with <code>CALL procedure_name(...);</code>.</li>
        <li>Delete with <code>DROP PROCEDURE procedure_name;</code>.</li>
        <li>In MariaDB, <code>CREATE OR REPLACE PROCEDURE</code> replaces an existing procedure with the same name.</li>
      </ul>
    </li>
    <li><b>Parameter Modes</b>:
      <ul>
        <li><code>IN</code> (Default): Supplies input values into the procedure. Syntax: <code>procedure_name(IN param_name data_type)</code>.</li>
        <li><code>OUT</code>: Returns a value back to the caller. A procedure can have more than one <code>OUT</code> parameter.</li>
        <li><code>INOUT</code>: Both receives an input value and returns a modified value back.</li>
      </ul>
    </li>
    <li><b>Naming Conventions</b>: Parameters commonly use the <code>p_</code> prefix (e.g. <code>p_deptno</code>) to avoid collision with column names. Procedure names follow standard identifier rules.</li>
    <li><b>Local Variables</b>: Declared inside <code>BEGIN...END</code> using <code>DECLARE var_name data_type;</code>. Assigned using <code>SET var_name = value;</code> or <code>SELECT col INTO var_name FROM ...;</code>.</li>
    <li><b>Session Variables</b>: Prefixed with <code>@</code> (e.g. <code>SET @count = 10;</code>), displayed with <code>SELECT @count;</code>.</li>
  </ul>
</div>
`;

      if (S.n >= S.qs.length) return endT();
      const q = S.qs[S.n], en = Array.isArray(q.a); S.lock = false;
      A.innerHTML = `<div class="hud"><span>Redo round</span><span>Score <b>${S.sc}</b></span></div><div class="bar"><i style="width:${S.n / S.qs.length * 100}%"></i></div><div class="tag">${W[q.t].n} &middot; ${S.n + 1} of ${S.qs.length} &middot; ${en ? "Enumeration" : "Fill in the blank"}</div><div class="q">${q.q}</div>` +
        Array.from({ length: q.n }, (_, k) => `<input class="inp ans" onkeydown="kd(event,this)" placeholder="${en ? (k + 1) + '.' : 'Type your answer'}">`).join("") + `<div class="fb" id="fb"></div><div id="nx"><button class="btn" onclick="checkT()">Check</button></div>`;
      $(".ans").focus();
    }
    function checkT() {
      if (S.lock) return; S.lock = true;
      const q = S.qs[S.n], en = Array.isArray(q.a), ins = [...document.querySelectorAll(".ans")], u = new Set(); let got = 0;
      ins.forEach(e => { const k = en ? q.a.findIndex((a, j) => !u.has(j) && hit(e.value, a)) : (hit(e.value, q.a) ? 0 : -1); if (k >= 0) { u.add(k); got++ } e.style.borderColor = k >= 0 ? "var(--ok)" : "var(--no)"; e.disabled = true });
      S.sc += got * 100; S.ok += got; S.tot += q.n; snd(got == q.n ? 660 : 180, .2);
      const ans = (en ? q.a : [q.a]).map(a => a.split("|")[0]).join(", ");
      if (got < q.n) S.miss.push([q.q, en && q.n < q.a.length ? "Examples: " + ans : ans]);
      $("#fb").textContent = (got == q.n ? "Correct. " : got ? got + " of " + q.n + " right. " : "Not quite. ") + (got < q.n ? (en && q.n < q.a.length ? "Examples: " : "Answer: ") + ans + ". " : "") + "+" + got * 100 + " pts";
      S.n++; $("#nx").innerHTML = `<button class="btn" onclick="askT()">${S.n >= S.qs.length ? "See results" : "Next"}</button>`;
    }
    function endT() {
      const k = "t" + (S.i < 0 ? "b" : S.i), nb = S.sc > (best[k] || 0); if (nb) { best[k] = S.sc; save() }
      const acc = Math.round(S.ok / S.tot * 100) || 0;
      A.innerHTML = `<div class="tag" style="margin-top:0">Redo results</div><h1>${acc}% correct</h1><p class="m">Score <b>${S.sc}</b>${nb ? " (new best)" : ""} &middot; ${S.ok} of ${S.tot} answers right. Redo scores are saved on this device only.</p>` +
        (S.miss.length ? `<h3>Review</h3>` + S.miss.map(m => `<div class="miss"><b>${m[0]}</b><br>${m[1]}</div>`).join("") : `<p class="m">No mistakes to review.</p>`) +
        `<button class="btn" onclick="startT(${S.i})">Redo again</button><button class="btn alt" onclick="start(${S.i})">Play multiple choice</button><button class="btn alt" onclick="home()">Back to topics</button>`;
    }

    const SUBJECTS = [
      { id: "tc", name: "Tech Comm", title: "Tech Comm Arena", W: W, F: F, bk: "tca", bp: "", ranks: ["Tech Comm Legend", "Report Pro", "Rising Writer"] },
      { id: "mt", name: "Mechatronics", title: "Mechatronics Arena", W: MW, F: MF, bk: "tca_mt", bp: "m", ranks: ["Mechatronics Master", "Control Pro", "Rising Technician"] },
      { id: "sql", name: "SQL", title: "SQL Arena", W: SW, F: SF, bk: "tca_sql", bp: "s", ranks: ["SQL Master", "Database Pro", "Query Builder"], notes: SQL_NOTES }
    ];
    function subjects() {
      clearInterval(T);
      stopLeaderboardRefresh();
      document.title = "Reviewer Arena";
      A.innerHTML = `<h1>Reviewer Arena</h1><p class="m">Choose a subject. Each subject has its own topics, best scores and leaderboards.</p><div class="grid">` +
        SUBJECTS.map((s, i) => `<button class="world" onclick="pickSubject(${i})"><span class="num">Subject ${i + 1}</span><b>${s.name}</b><small>${s.W.length} topic${s.W.length > 1 ? "s" : ""} &middot; ${s.W.reduce((n, w) => n + w.q.length, 0)} questions</small></button>`).join("") + `</div>`;
    }
    function pickSubject(i) {
      SUB = SUBJECTS[i]; W = SUB.W; F = SUB.F;
      best = {}; try { best = JSON.parse(localStorage.getItem(SUB.bk) || "{}") } catch (e) { }
      home();
    }
    subjects();


  </script>
</body>
