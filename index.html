<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tech Comm Arena</title>
  <style>
    :root {
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      --bg: #fff;
      --tx: #1f2328;
      --mut: #656d76;
      --bd: #d0d7de;
      --sf: #f6f8fa;
      --ac: #24292f;
      --acx: #fff;
      --ok: #1a7f37;
      --okb: #dafbe1;
      --no: #cf222e;
      --nob: #ffebe9
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --bg: #1b1d21;
        --tx: #e6e8eb;
        --mut: #9aa1ab;
        --bd: #3a3f47;
        --sf: #24272c;
        --ac: #e6e8eb;
        --acx: #1b1d21;
        --ok: #56d364;
        --okb: #16301f;
        --no: #ff7b72;
        --nob: #3b1d1d
      }
    }

    :root[data-theme="dark"] {
      --bg: #1b1d21;
      --tx: #e6e8eb;
      --mut: #9aa1ab;
      --bd: #3a3f47;
      --sf: #24272c;
      --ac: #e6e8eb;
      --acx: #1b1d21;
      --ok: #56d364;
      --okb: #16301f;
      --no: #ff7b72;
      --nob: #3b1d1d
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--tx);
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif
    }

    .app {
      max-width: 600px;
      margin: auto;
      padding: 28px 16px
    }

    h1 {
      margin: 0 0 6px;
      font-size: 24px;
      font-weight: 600
    }

    h3 {
      font-size: 15px;
      margin: 24px 0 8px
    }

    .m {
      color: var(--mut);
      margin: 0 0 20px
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px
    }

    .world,
    .opt,
    .btn {
      font: inherit;
      color: var(--tx);
      background: var(--bg);
      border: 1px solid var(--bd);
      border-radius: 8px;
      padding: 14px;
      cursor: pointer;
      text-align: left
    }

    .world {
      display: flex;
      flex-direction: column;
      gap: 2px
    }

    .world:hover,
    .opt:hover:not(:disabled) {
      border-color: var(--tx);
      background: var(--sf)
    }

    .world b {
      font-weight: 600
    }

    .num,
    small,
    .tag {
      color: var(--mut);
      font-size: 12px
    }

    .boss {
      width: 100%;
      background: var(--sf)
    }

    .hud {
      display: flex;
      justify-content: space-between;
      color: var(--mut);
      font-size: 13px;
      margin-bottom: 10px
    }

    .hud b {
      color: var(--tx)
    }

    .bar {
      height: 4px;
      background: var(--bd);
      border-radius: 2px;
      overflow: hidden;
      margin: 6px 0
    }

    .bar i {
      display: block;
      height: 100%;
      background: var(--ac);
      transition: width .1s linear
    }

    .tag {
      text-transform: uppercase;
      letter-spacing: .04em;
      margin-top: 16px
    }

    .q {
      font-size: 20px;
      font-weight: 600;
      line-height: 1.35;
      margin: 8px 0 16px
    }

    .opt {
      display: block;
      width: 100%;
      margin: 8px 0
    }

    .opt:disabled {
      cursor: default
    }

    .opt.ok {
      border-color: var(--ok);
      background: var(--okb)
    }

    .opt.no {
      border-color: var(--no);
      background: var(--nob)
    }

    .btn {
      background: var(--ac);
      border-color: var(--ac);
      color: var(--acx);
      text-align: center;
      font-weight: 600;
      width: 100%;
      margin-top: 10px
    }

    .btn.alt {
      background: var(--bg);
      color: var(--tx);
      border-color: var(--bd)
    }

    .fb {
      min-height: 22px;
      color: var(--mut);
      font-size: 14px;
      margin: 8px 0 0
    }

    .miss {
      background: var(--sf);
      border: 1px solid var(--bd);
      border-radius: 8px;
      padding: 12px;
      margin: 8px 0;
      font-size: 14px
    }

    .inp {
      font: inherit;
      color: var(--tx);
      background: var(--bg);
      border: 1px solid var(--bd);
      border-radius: 8px;
      padding: 10px 12px;
      width: 100%;
      margin: 8px 0
    }

    .lb {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      margin: 8px 0
    }

    .lb th,
    .lb td {
      text-align: left;
      padding: 8px 6px;
      border-bottom: 1px solid var(--bd);
      white-space: nowrap
    }

    .lb th {
      color: var(--mut);
      font-weight: 600
    }

    .q img,
    .opt img,
    .miss img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 6px auto
    }

    .opt img {
      max-height: 80px;
      object-fit: contain
    }

    .notes {
      line-height: 1.6;
      font-size: 14px;
      margin-bottom: 20px
    }

    .notes h3 {
      font-size: 16px;
      color: var(--tx);
      border-bottom: 1px solid var(--bd);
      padding-bottom: 6px;
      margin: 18px 0 8px
    }

    .notes p,
    .notes ul {
      margin: 8px 0;
      color: var(--mut)
    }

    .notes ul {
      padding-left: 20px
    }

    .notes li {
      margin: 4px 0
    }

    .notes code {
      font-family: monospace;
      background: var(--sf);
      border: 1px solid var(--bd);
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 13px;
      color: var(--tx)
    }

    .notes pre {
      background: var(--sf);
      border: 1px solid var(--bd);
      border-radius: 6px;
      padding: 10px;
      overflow-x: auto;
      margin: 8px 0
    }

    .notes pre code {
      border: none;
      padding: 0;
      background: transparent
    }
  </style>

    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };

</head>

        ["TCL stands for Transaction ____ Language.", "control"],
        ["The DDL command used to remove all rows while preserving table structure is ____.", "truncate"],
        ["The principal command of DQL used to retrieve data is ____.", "select"],
        ["The clause used to sort query results is ORDER ____.", "by"],
        ["To eliminate duplicate rows from a query result, use the ____ keyword.", "distinct"],
        ["The aggregate function that calculates the number of rows matching a criteria is ____().", "count"],
        ["The clause used to filter grouped or aggregated data is ____.", "having"],
        ["List the 2 principal DCL commands.", ["grant", "revoke"]],
        ["The TCL command that makes all database changes permanent is ____.", "commit"],
        ["The TCL command used to undo uncommitted changes is ____.", "rollback"],
        ["A named checkpoint within a transaction is created with the ____ statement.", "savepoint"]
      ],
      [
        ["phpMyAdmin is developed using the ____ programming language.", "php"],
        ["List the 3 administrative levels of phpMyAdmin from broadest to most specific.", ["server", "database|db", "table"]],
        ["In MySQL and MariaDB, DATABASE and ____ are used interchangeably.", "schema"],
        ["MariaDB was created in the year ____.", "2009"],
        ["MariaDB originated as a ____ of MySQL.", "fork"],
        ["The MySQL storage engine that supports ACID transactions and foreign keys is ____.", "innodb"],
        ["The MariaDB storage engine that stores temporary tables in RAM is ____.", "memory"],
        ["In the XAMPP acronym, the letter A stands for the ____ HTTP server.", "apache"],
        ["In the XAMPP acronym, the letter X stands for ____-platform.", "cross"],
        ["A ____ key uniquely identifies each record in a database table.", "primary"],
        ["A ____ key establishes a relationship by referencing a key in another table.", "foreign"],
        ["A ____ is a virtual table defined by an SQL query.", "view"],
        ["In the sample database, department ____ has no assigned employees in EMP.", "40"],
        ["A database ____ automatically executes when an INSERT, UPDATE, or DELETE occurs.", "trigger"],
        ["The intersection of a row and a column holds an individual ____.", "value|cell"]
      ],
      [
        ["The built-in function that chooses between two values in an expression is ____().", "if"],
        ["The syntax for the IF function is IF(condition, value_if_true, value_if_____).", "false"],
        ["In stored procedures, an IF statement block is closed with the keywords END ____.", "if"],
        ["In an IF statement, the keyword that follows the condition is ____.", "then"],
        ["The multi-way conditional structure in stored procedures uses IF .. THEN .. ____ .. ELSE.", "elseif"],
        ["A conditional control-flow statement using WHEN clauses to match values is the ____ statement.", "case"],
        ["In a CASE statement, the optional catch-all clause when no condition matches is ____.", "else"],
        ["A CASE statement in a MySQL stored procedure is terminated with END ____.", "case"],
        ["What does IF(5 > 3, 'Yes', 'No') evaluate to: ____.", "yes"],
        ["Procedural IF and CASE statements can only be executed inside stored ____.", "programs|procedures|routines"]
      ],
      [
        ["The first version of MySQL was released in May of the year ____.", "1995"],
        ["Michael 'Monty' Widenius, one of MySQL's principal creators, is from ____.", "finland"],
        ["David Axmark and Allan Larsson are from ____.", "sweden"],
        ["MySQL adopted the GNU GPL open-source license in the year ____.", "2000"],
        ["MySQL version ____.0 introduced stored procedures, triggers, and views in 2005.", "5"],
        ["Sun Microsystems acquired MySQL AB in the year ____.", "2008"],
        ["Oracle completed its acquisition of Sun Microsystems in the year ____.", "2010"],
        ["MySQL version 5.7 introduced support for the ____ data type.", "json"],
        ["In 2024, MySQL 8.4 was introduced as the first ____ series.", "lts|long term support"],
        ["The maximum length for table and procedure identifiers in MySQL is ____ characters.", "64"],
        ["A ____ function in MySQL returns a single value, whereas a procedure returns zero or more.", "stored|function"],
        ["The constraint that ensures all values in a column are distinct is ____.", "unique"]
      ]
    ];

    const norm = s => String(s).toLowerCase().replace(/[“”"’'‘.,;:!?()%]/g, "").replace(/[-&]/g, " ").replace(/\s+/g, " ").trim();
    function lev(a, b) { const d = []; for (let i = 0; i <= a.length; i++)d[i] = [i]; for (let j = 1; j <= b.length; j++)d[0][j] = j; for (let i = 1; i <= a.length; i++)for (let j = 1; j <= b.length; j++)d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] == b[j - 1] ? 0 : 1)); return d[a.length][b.length] }
    const hit = (v, acc) => { v = norm(v); return v && acc.split("|").some(a => { a = norm(a); return v === a || (a.length > 3 && v.includes(a)) || (a.length > 5 && lev(v, a) < 2) }) };
    function startT(i) {
      const pool = (i < 0 ? F.flatMap((a, k) => a.map(x => ({ x, k }))) : F[i].map(x => ({ x, k: i }))).map(({ x, k }) => ({ q: x[0], a: x[1], n: x[2] || (Array.isArray(x[1]) ? x[1].length : 1), t: k }));
      S = { i, T: 1, qs: sh(pool).slice(0, i < 0 ? 10 : 99), n: 0, sc: 0, ok: 0, tot: 0, miss: [], lock: false }; askT();
    }
    function kd(e, el) { if (e.key !== "Enter") return; const n = el.nextElementSibling; if (n && n.classList.contains("ans")) n.focus(); else checkT() }
    function askT() {
      if (S.n >= S.qs.length) return endT();
      const q = S.qs[S.n], en = Array.isArray(q.a); S.lock = false;
      A.innerHTML = `<div class="hud"><span>Redo round</span><span>Score <b>${S.sc}</b></span></div><div class="bar"><i style="width:${S.n / S.qs.length * 100}%"></i></div><div class="tag">${W[q.t].n} &middot; ${S.n + 1} of ${S.qs.length} &middot; ${en ? "Enumeration" : "Fill in the blank"}</div><div class="q">${q.q}</div>` +
        Array.from({ length: q.n }, (_, k) => `<input class="inp ans" onkeydown="kd(event,this)" placeholder="${en ? (k + 1) + '.' : 'Type your answer'}">`).join("") + `<div class="fb" id="fb"></div><div id="nx"><button class="btn" onclick="checkT()">Check</button></div>`;
      $(".ans").focus();
    }
    function checkT() {
      if (S.lock) return; S.lock = true;
      const q = S.qs[S.n], en = Array.isArray(q.a), ins = [...document.querySelectorAll(".ans")], u = new Set(); let got = 0;
      ins.forEach(e => { const k = en ? q.a.findIndex((a, j) => !u.has(j) && hit(e.value, a)) : (hit(e.value, q.a) ? 0 : -1); if (k >= 0) { u.add(k); got++ } e.style.borderColor = k >= 0 ? "var(--ok)" : "var(--no)"; e.disabled = true });
      S.sc += got * 100; S.ok += got; S.tot += q.n; snd(got == q.n ? 660 : 180, .2);
      const ans = (en ? q.a : [q.a]).map(a => a.split("|")[0]).join(", ");
      if (got < q.n) S.miss.push([q.q, en && q.n < q.a.length ? "Examples: " + ans : ans]);
      $("#fb").textContent = (got == q.n ? "Correct. " : got ? got + " of " + q.n + " right. " : "Not quite. ") + (got < q.n ? (en && q.n < q.a.length ? "Examples: " : "Answer: ") + ans + ". " : "") + "+" + got * 100 + " pts";
      S.n++; $("#nx").innerHTML = `<button class="btn" onclick="askT()">${S.n >= S.qs.length ? "See results" : "Next"}</button>`;
    }
    function endT() {
      const k = "t" + (S.i < 0 ? "b" : S.i), nb = S.sc > (best[k] || 0); if (nb) { best[k] = S.sc; save() }
      const acc = Math.round(S.ok / S.tot * 100) || 0;
      A.innerHTML = `<div class="tag" style="margin-top:0">Redo results</div><h1>${acc}% correct</h1><p class="m">Score <b>${S.sc}</b>${nb ? " (new best)" : ""} &middot; ${S.ok} of ${S.tot} answers right. Redo scores are saved on this device only.</p>` +
        (S.miss.length ? `<h3>Review</h3>` + S.miss.map(m => `<div class="miss"><b>${m[0]}</b><br>${m[1]}</div>`).join("") : `<p class="m">No mistakes to review.</p>`) +
        `<button class="btn" onclick="startT(${S.i})">Redo again</button><button class="btn alt" onclick="start(${S.i})">Play multiple choice</button><button class="btn alt" onclick="home()">Back to topics</button>`;
    }

    const SUBJECTS = [
      { id: "tc", name: "Tech Comm", title: "Tech Comm Arena", W: W, F: F, bk: "tca", bp: "", ranks: ["Tech Comm Legend", "Report Pro", "Rising Writer"] },
      { id: "mt", name: "Mechatronics", title: "Mechatronics Arena", W: MW, F: MF, bk: "tca_mt", bp: "m", ranks: ["Mechatronics Master", "Control Pro", "Rising Technician"], notes: MT_NOTES },
      { id: "sql", name: "SQL", title: "SQL Arena", W: SW, F: SF, bk: "tca_sql", bp: "s", ranks: ["SQL Master", "Database Pro", "Query Builder"], notes: SQL_NOTES }
    ];
    function subjects() {
      clearInterval(T);
      stopLeaderboardRefresh();
      document.title = "Reviewer Arena";
      A.innerHTML = `<h1>Reviewer Arena</h1><p class="m">Choose a subject. Each subject has its own topics, best scores and leaderboards.</p><div class="grid">` +
        SUBJECTS.map((s, i) => `<button class="world" onclick="pickSubject(${i})"><span class="num">Subject ${i + 1}</span><b>${s.name}</b><small>${s.W.length} topic${s.W.length > 1 ? "s" : ""} &middot; ${s.W.reduce((n, w) => n + w.q.length, 0)} questions</small></button>`).join("") + `</div>`;
    }
    function pickSubject(i) {
      SUB = SUBJECTS[i]; W = SUB.W; F = SUB.F;
      best = {}; try { best = JSON.parse(localStorage.getItem(SUB.bk) || "{}") } catch (e) { }
      home();
    }
    subjects();


  </script>
