const $=s=>document.querySelector(s),A=$("#app");
let best={},S={},T;
try{best=JSON.parse(localStorage.getItem("tca")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("tca",JSON.stringify(best))}catch(e){}};
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function snd(f,d){try{const c=snd.c||(snd.c=new AudioContext()),o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d)}catch(e){}}
function home(){
 clearInterval(T);
 A.innerHTML=`<h1>Tech Comm Arena</h1><p class="m">Choose a topic. You have 3 lives and 15 seconds per question. Consecutive correct answers raise your score multiplier.</p><div class="grid">`+
 W.map((w,i)=>`<button class="world" onclick="start(${i})"><span class="num">Topic ${i+1}</span><b>${w.n}</b><small>${w.q.length} questions &middot; Best ${best[i]||0}</small></button>`).join("")+
 `</div><button class="world boss" onclick="start(-1)"><b>Mixed Challenge</b><small>12 random questions from all topics &middot; Best ${best.b||0}</small></button><button class="btn alt" onclick="showLb()">View leaderboards</button>`;
}
function start(i){
 const qs=i<0?sh(W.flatMap((w,k)=>w.q.map(q=>[...q,k]))).slice(0,12):sh(W[i].q).map(q=>[...q,i]);
 S={i,qs,n:0,hp:3,sc:0,st:0,ok:0,miss:[]};ask();
}
function ask(){
 if(S.n>=S.qs.length||S.hp<=0)return end();
 const q=S.qs[S.n],w=W[q[5]];S.o=sh(q.slice(1,5));S.t=15;S.lock=false;
 A.innerHTML=`<div class="hud"><span>Lives <b>${S.hp}/3</b></span><span>Multiplier <b>x${Math.min(1+S.st*.5,3)}</b></span><span>Score <b>${S.sc}</b></span></div>
 <div class="bar"><i style="width:${S.n/S.qs.length*100}%"></i></div>
 <div class="bar"><i id="tm" style="width:100%"></i></div>
 <div class="tag">${w.n} &middot; ${S.n+1} of ${S.qs.length} &middot; <span id="sec">15s</span></div><div class="q">${q[0]}</div>`+
 S.o.map((o,k)=>`<button class="opt" onclick="pick(${k})">${o}</button>`).join("")+`<div class="fb" id="fb"></div><div id="nx"></div>`;
 clearInterval(T);T=setInterval(()=>{S.t-=.1;const b=$("#tm");if(b){b.style.width=S.t/15*100+"%";if(S.t<5)b.style.background="var(--no)"}const c=$("#sec");if(c)c.textContent=Math.max(Math.ceil(S.t),0)+"s";if(S.t<=0)pick(-1)},100);
}
function pick(k){
 if(S.lock)return;S.lock=true;clearInterval(T);
 const q=S.qs[S.n],right=q[1],good=k>=0&&S.o[k]===right,bs=document.querySelectorAll(".opt");
 bs.forEach((b,j)=>{b.disabled=true;if(S.o[j]===right)b.classList.add("ok");else if(j===k)b.classList.add("no")});
 if(good){const m=Math.min(1+S.st*.5,3),p=Math.round((100+Math.max(S.t,0)*6)*m);S.sc+=p;S.st++;S.ok++;snd(660,.15);
  $("#fb").textContent=(S.st>1?"Correct, streak bonus. ":"Correct. ")+"+"+p+" pts"}
 else{S.hp--;S.st=0;S.miss.push([q[0],right]);snd(180,.3);$("#fb").textContent=k<0?"Time’s up. One life lost.":"Incorrect. One life lost."}
 S.n++;$("#nx").innerHTML=`<button class="btn" onclick="ask()">${S.n>=S.qs.length||S.hp<=0?"See results":"Next"}</button>`;
}
function end(){
 const acc=Math.round(S.ok/S.n*100)||0,dead=S.hp<=0,k=S.i<0?"b":S.i;
 const nb=S.sc>(best[k]||0);if(nb){best[k]=S.sc;save()}
 const r=dead?"Out of lives":acc>=90?"Tech Comm Legend":acc>=70?"Report Pro":acc>=50?"Rising Writer":"Keep practicing";
 A.innerHTML=`<div class="tag" style="margin-top:0">Results</div><h1>${r}</h1><p class="m">Score <b>${S.sc}</b>${nb?" (new best)":""} &middot; ${S.ok} of ${S.n} correct (${acc}%)</p>`+
 (S.miss.length?`<h3>Review</h3>`+S.miss.map(m=>`<div class="miss"><b>${m[0]}</b><br>Answer: ${m[1]}</div>`).join(""):`<p class="m">No mistakes to review.</p>`)+
 `<div id="lb"></div><p class="m">Next: redo this topic from memory. No choices this time, you type the answers (fill in the blanks and enumerations).</p><button class="btn" onclick="startT(${S.i})">Start redo: type the answers</button><button class="btn alt" onclick="start(${S.i})">Play multiple choice again</button><button class="btn alt" onclick="home()">Back to topics</button>`;
 let nm="";try{nm=localStorage.getItem("tca_name")||""}catch(e){}
 if(nm)submitScore(nm);
 else $("#lb").innerHTML=`<h3>Leaderboard</h3><input id="nm" class="inp" maxlength="16" placeholder="Your name"><button class="btn" onclick="submitScore($('#nm').value)">Submit score</button>`;
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function lbTable(rows){
 return rows.length?`<div style="overflow-x:auto"><table class="lb"><tr><th>#</th><th>Player</th><th>Device</th><th>IP</th><th>Score</th></tr>`+
 rows.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.name)}</td><td>${esc(r.dev)}</td><td>${esc(r.ip)}</td><td>${r.score}</td></tr>`).join("")+`</table></div>`:`<p class="m">No scores yet.</p>`;
}
async function submitScore(name){
 name=(name||"").trim();if(!name)return;
 try{localStorage.setItem("tca_name",name)}catch(e){}
 const el=$("#lb");el.innerHTML=`<h3>Leaderboard</h3><p class="m">Submitting…</p>`;
 try{
  const r=await fetch("/api/leaderboard",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({board:S.i<0?"b":String(S.i),score:S.sc,name})});
  const j=await r.json();if(!r.ok)throw 0;
  const msg={new:"Added to the leaderboard.",improved:"Score improved for this device and IP.",same_ip:"This IP and device already has an equal or higher score here, so the board was not changed."}[j.status];
  el.innerHTML=`<h3>Leaderboard</h3><p class="m">${msg}</p>`+lbTable(j.rows);
 }catch(e){el.innerHTML=`<h3>Leaderboard</h3><p class="m">Leaderboard unavailable right now.</p>`}
}
async function showLb(k="0"){
 clearInterval(T);
 A.innerHTML=`<h1>Leaderboards</h1><p class="m">Top 10 per topic. One entry per IP and device; a repeat entry only counts if the score is higher.</p><select id="sel" class="inp" onchange="showLb(this.value)">`+
 W.map((w,i)=>`<option value="${i}">${w.n}</option>`).join("")+`<option value="b">Mixed Challenge</option></select><div id="lbt"><p class="m">Loading…</p></div><button class="btn alt" onclick="home()">Back to topics</button>`;
 $("#sel").value=k;
 try{const r=await fetch("/api/leaderboard?board="+k);if(!r.ok)throw 0;$("#lbt").innerHTML=lbTable((await r.json()).rows)}
 catch(e){$("#lbt").innerHTML=`<p class="m">Leaderboard unavailable right now.</p>`}
}

const F=[
[["Technical communication is a ____ field that conveys complex information clearly, accurately and accessibly.","broad"],

const norm=s=>String(s).toLowerCase().replace(/[“”"’'‘.,;:!?()%]/g,"").replace(/[-&]/g," ").replace(/\s+/g," ").trim();
function lev(a,b){const d=[];for(let i=0;i<=a.length;i++)d[i]=[i];for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]==b[j-1]?0:1));return d[a.length][b.length]}
const hit=(v,acc)=>{v=norm(v);return v&&acc.split("|").some(a=>{a=norm(a);return v===a||(a.length>3&&v.includes(a))||(a.length>5&&lev(v,a)<2)})};
function startT(i){
 const pool=(i<0?F.flatMap((a,k)=>a.map(x=>({x,k}))):F[i].map(x=>({x,k:i}))).map(({x,k})=>({q:x[0],a:x[1],n:x[2]||(Array.isArray(x[1])?x[1].length:1),t:k}));
 S={i,T:1,qs:sh(pool).slice(0,i<0?10:99),n:0,sc:0,ok:0,tot:0,miss:[],lock:false};askT();
}
function kd(e,el){if(e.key!=="Enter")return;const n=el.nextElementSibling;if(n&&n.classList.contains("ans"))n.focus();else checkT()}
function askT(){
 if(S.n>=S.qs.length)return endT();
 const q=S.qs[S.n],en=Array.isArray(q.a);S.lock=false;
 A.innerHTML=`<div class="hud"><span>Redo round</span><span>Score <b>${S.sc}</b></span></div><div class="bar"><i style="width:${S.n/S.qs.length*100}%"></i></div><div class="tag">${W[q.t].n} &middot; ${S.n+1} of ${S.qs.length} &middot; ${en?"Enumeration":"Fill in the blank"}</div><div class="q">${q.q}</div>`+
 Array.from({length:q.n},(_,k)=>`<input class="inp ans" onkeydown="kd(event,this)" placeholder="${en?(k+1)+'.':'Type your answer'}">`).join("")+`<div class="fb" id="fb"></div><div id="nx"><button class="btn" onclick="checkT()">Check</button></div>`;
 $(".ans").focus();
}
function checkT(){
 if(S.lock)return;S.lock=true;
 const q=S.qs[S.n],en=Array.isArray(q.a),ins=[...document.querySelectorAll(".ans")],u=new Set();let got=0;
 ins.forEach(e=>{const k=en?q.a.findIndex((a,j)=>!u.has(j)&&hit(e.value,a)):(hit(e.value,q.a)?0:-1);if(k>=0){u.add(k);got++}e.style.borderColor=k>=0?"var(--ok)":"var(--no)";e.disabled=true});
 S.sc+=got*100;S.ok+=got;S.tot+=q.n;snd(got==q.n?660:180,.2);
 const ans=(en?q.a:[q.a]).map(a=>a.split("|")[0]).join(", ");
 if(got<q.n)S.miss.push([q.q,en&&q.n<q.a.length?"Examples: "+ans:ans]);
 $("#fb").textContent=(got==q.n?"Correct. ":got?got+" of "+q.n+" right. ":"Not quite. ")+(got<q.n?(en&&q.n<q.a.length?"Examples: ":"Answer: ")+ans+". ":"")+"+"+got*100+" pts";
 S.n++;$("#nx").innerHTML=`<button class="btn" onclick="askT()">${S.n>=S.qs.length?"See results":"Next"}</button>`;
}
function endT(){
 const k="t"+(S.i<0?"b":S.i),nb=S.sc>(best[k]||0);if(nb){best[k]=S.sc;save()}
 const acc=Math.round(S.ok/S.tot*100)||0;
 A.innerHTML=`<div class="tag" style="margin-top:0">Redo results</div><h1>${acc}% correct</h1><p class="m">Score <b>${S.sc}</b>${nb?" (new best)":""} &middot; ${S.ok} of ${S.tot} answers right. Redo scores are saved on this device only.</p>`+
 (S.miss.length?`<h3>Review</h3>`+S.miss.map(m=>`<div class="miss"><b>${m[0]}</b><br>${m[1]}</div>`).join(""):`<p class="m">No mistakes to review.</p>`)+
 `<button class="btn" onclick="startT(${S.i})">Redo again</button><button class="btn alt" onclick="start(${S.i})">Play multiple choice</button><button class="btn alt" onclick="home()">Back to topics</button>`;
}
